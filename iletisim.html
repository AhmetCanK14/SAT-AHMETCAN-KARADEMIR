<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>İletişim | Restoran</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <div class="container navbar">
    <div class="brand">
      <div class="brand-badge">🍽️</div>
      <span>Restoran</span>
    </div>
    <div class="nav-links">
      <a href="menu.html">Menüler</a>
      <a href="rezervasyon.html">Rezervasyon</a>
      <a href="hakkimizda.html">Hakkımızda</a>
      <a class="active" href="iletisim.html">İletişim</a>
    </div>
  </div>
</nav>

<main class="section">
  <div class="container">
    <div class="two-col">
      <div class="form-card">
        <h2 style="margin:0 0 10px;">Bize Ulaş</h2>
        <p class="help">
          Telefon: <b>0 (5xx) xxx xx xx</b><br/>
          E-posta: <b>info@restoran.com</b><br/>
          Adres: <b>Merkez / İstanbul</b>
        </p>
      </div>

      <div class="form-card">
        <h3 style="margin:0 0 10px;">Mesaj Gönder</h3>
        <form id="contactForm">
          <label>Ad Soyad</label>
          <input type="text" name="name" id="name" required placeholder="Adın soyadın" />

          <label>E-posta</label>
          <input type="email" name="email" id="email" required placeholder="mail@ornek.com" />

          <label>Mesaj</label>
          <textarea name="message" id="message" required placeholder="Ne diyorsun?"></textarea>

          <div id="formMessage" style="margin-top:12px; padding:12px; border-radius:8px; display:none;"></div>

          <button class="btn primary" type="submit" id="submitBtn" style="width:100%; margin-top:12px;">
            Gönder
          </button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <p>&copy; 2025 Restoran</p>
  </div>
</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const form = this;
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('formMessage');
    const formData = new FormData(form);
    
    // Butonu devre dışı bırak
    submitBtn.disabled = true;
    submitBtn.textContent = 'Gönderiliyor...';
    messageDiv.style.display = 'none';
    
    try {
        const response = await fetch('api_iletisim.php', {
            method: 'POST',
            body: formData
        });

        // Önce ham metni al ve JSON parse etmeye çalış
        const text = await response.text();
        let data = null;
        try {
            data = text ? JSON.parse(text) : null;
        } catch (e) {
            console.error('Sunucudan gelen yanıt JSON değil:', text);
        }

        // HTTP hatası varsa server mesajını göster
        if (!response.ok) {
            const serverMsg = data && (data.error || data.message) ? (data.error || data.message) : (text || `Sunucu hatası: ${response.status}`);
            throw new Error(serverMsg);
        }

        if (data && data.success) {
            messageDiv.style.display = 'block';
            messageDiv.style.background = 'rgba(16,185,129,.2)';
            messageDiv.style.border = '1px solid #10b981';
            messageDiv.style.color = '#10b981';
            messageDiv.textContent = data.message || 'Mesajınız başarıyla gönderildi!';
            form.reset();
        } else {
            const errMsg = data && (data.error || data.message) ? (data.error || data.message) : 'Bir hata oluştu!';
            throw new Error(errMsg);
        }
    } catch (error) {
        messageDiv.style.display = 'block';
        messageDiv.style.background = 'rgba(239,68,68,.2)';
        messageDiv.style.border = '1px solid #ef4444';
        messageDiv.style.color = '#ef4444';
        messageDiv.textContent = error.message || 'Bağlantı hatası! Lütfen tekrar deneyin.';
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Gönder';
    }
});
</script>

</body>
</html>
